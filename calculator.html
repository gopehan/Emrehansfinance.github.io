<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <style>
        /* Background Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background: linear-gradient(135deg, #20c1b9, #d3809b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Calculator Container */
        .container {
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 320px;
            animation: fadeIn 1.2s ease-in-out;
        }

        h1 {
            color: #333;
            font-size: 22px;
        }

        /* Input Styling */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Button Styling */
        .btn {
            padding: 10px 18px;
            font-size: 15px;
            color: white;
            background: linear-gradient(135deg, #6a7f4f, #828d65);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease-in-out;
        }

        .btn:hover {
            background: linear-gradient(135deg, #828d65, #6a7f4f);
            transform: scale(1.05);
        }

        /* Result Display */
        .result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* Fade-In Animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Compound Interest Calculator</h1>
        
        <div class="input-group">
            <label for="principal">Principal Amount ($)</label>
            <input type="number" id="principal" placeholder="Enter principal amount" value="1000">
        </div>

        <div class="input-group">
            <label for="rate">Annual Interest Rate (%)</label>
            <input type="number" id="rate" placeholder="Enter interest rate" value="5">
        </div>

        <div class="input-group">
            <label for="years">Number of Years</label>
            <input type="number" id="years" placeholder="Enter years" value="10">
        </div>

        <div class="input-group">
            <label for="compounds">Compounds per Year</label>
            <input type="number" id="compounds" placeholder="Enter times compounded per year" value="12">
        </div>

        <button class="btn" onclick="calculateInterest()">Calculate</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateInterest() {
            // Get input values
            let principal = parseFloat(document.getElementById("principal").value);
            let rate = parseFloat(document.getElementById("rate").value) / 100;
            let years = parseFloat(document.getElementById("years").value);
            let compounds = parseFloat(document.getElementById("compounds").value);

            // Validate inputs
            if (isNaN(principal) || isNaN(rate) || isNaN(years) || isNaN(compounds) || principal <= 0 || rate <= 0 || years <= 0 || compounds <= 0) {
                document.getElementById("result").innerHTML = "Please enter valid numbers.";
                return;
            }

            // Compound interest formula
            let amount = principal * Math.pow(1 + rate / compounds, compounds * years);
            let finalAmount = amount.toFixed(2);

            // Display result
            document.getElementById("result").innerHTML = `Final Amount: $${finalAmount}`;
        }
    </script>

</body>
</html>
