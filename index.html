<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        /* Background Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background: linear-gradient(135deg, #20c1b9, #d3809b);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Restoring Original Look */
        .container {
            padding: 50px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background: linear-gradient(135deg, #828d65, #6a7f4f);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            width: 150px;
            text-align: center;
            transition: 0.3s ease-in-out;
        }

        .btn:hover {
            background: linear-gradient(135deg, #6a7f4f, #828d65);
            transform: scale(1.05);
        }

        /* Footer Styling */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #6a7f4f;
            color: white;
            padding: 10px 0;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Contact Me Button */
        .contact-btn {
            padding: 8px 15px;
            font-size: 14px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .contact-btn:hover {
            background: #e64a19;
        }

        /* LinkedIn Icon */
        .linkedin-icon {
            width: 28px;
            height: 28px;
            margin-left: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        .linkedin-icon:hover {
            transform: scale(1.2);
        }

        /* Contact Form Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        .modal h2 {
            margin-bottom: 15px;
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .modal button {
            padding: 10px;
            border: none;
            background: #6a7f4f;
            color: white;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            border-radius: 5px;
        }

        .modal button:hover {
            background: #4f6a3f;
        }

        .close {
            float: right;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: red;
        }

        /* Fade-In Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Restoring Original Header -->
    <div class="container">
        <h1>Welcome to the Weather App</h1>
        <p>Click the button below to check the weather.</p>

        <div class="button-container">
            <a href="resume.html" class="btn">Resume</a>
            <a href="calculator.html" class="btn">Calculator</a>
            <a href="#" class="btn">In Development</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>Email: <a href="mailto:your.email@example.com">your.email@example.com</a></p>
        <button class="contact-btn" onclick="openModal()">Contact Me</button>
        <a href="YOUR_LINKEDIN_URL" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="linkedin-icon">
        </a>
    </div>

    <!-- Contact Form Modal -->
    <div class="modal" id="contactModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Contact Me</h2>
            <input type="text" id="name" placeholder="Your Name">
            <input type="email" id="email" placeholder="Your Email">
            <textarea id="message" rows="4" placeholder="Your Message"></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("contactModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("contactModal").style.display = "none";
        }

        function sendMessage() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;

            if (!name || !email || !message) {
                alert("Please fill in all fields.");
                return;
            }

            let mailtoLink = `mailto:your.email@example.com?subject=Message from ${name}&body=${message}%0D%0A%0D%0AFrom: ${email}`;
            window.location.href = mailtoLink;
            closeModal();
        }

        window.onclick = function(event) {
            let modal = document.getElementById("contactModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>

</body>
</html>
