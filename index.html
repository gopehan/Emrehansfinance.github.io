<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Emrehan Seferoglu</title>
    <style>
        /* Background Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* Full-screen overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease-in-out;
        }

        #overlay p {
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        #overlay button {
            padding: 12px 24px;
            border: none;
            background: white;
            color: #1e3c72;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        #overlay button:hover {
            background: #ddd;
        }

        /* Header Styling */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: fixed;
            top: 0;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .header .top-right {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 40px;
        }

        .linkedin-icon {
            width: 28px;
            height: 28px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        .linkedin-icon:hover {
            transform: scale(1.2);
        }

        .projects {
            width: 100%; 
            margin: 100px 0 50px;
            padding: 50px 0; 
            background: rgba(255, 255, 255, 0.2);
            border-radius: 0; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .project-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 500px;
            height: 220px;
            background: rgba(255, 255, 255, 0.2);
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .project-box img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .project-list {
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 20px; 
        }

        .project-box:hover {
            transform: scale(1.05);
        }

        .resume-section {
            margin: 50px 0;
            padding: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Translucent Cover -->
    <div id="overlay">
        <p>Welcome to my Portfolio</p>
        <button onclick="removeOverlay()">Enter</button>
    </div>

    <div class="header">
        <h1>Emrehan Seferoglu</h1>
        <div class="top-right">
            <!-- LinkedIn icon only -->
            <a href="https://www.linkedin.com/in/emrehan-seferoglu-8b3675218" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" 
                     alt="LinkedIn" class="linkedin-icon">
            </a>
        </div>
    </div>

    <div class="projects">
        <h2>Projects</h2>
        <div class="project-list">
            <!-- Weather App project -->
            <a href="weatherapp.html" class="project-box">
                <img src="https://cdn-icons-png.flaticon.com/512/1163/1163624.png" alt="Weather App">
                Weather App
            </a>
            <!-- Calculator project -->
            <a href="calculator.html" class="project-box">
                <img src="https://cdn-icons-png.flaticon.com/512/2821/2821637.png" alt="Calculator">
                Compounding Interest Calculator
            </a>
        </div>
    </div>
    
    <div class="resume-section">
        <h2>My Resume</h2>
        <iframe
            src="resume.pdf" 
            width="100%" 
            height="600px"
            style="border: none; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px);">
        </iframe>
    </div>

    <script>
        function removeOverlay() {
            let overlay = document.getElementById("overlay");
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = "none";
            }, 500);
        }
    </script>

</body>
</html>
