<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        /* Gradient Background */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background: linear-gradient(135deg, #20c1b9, #d3809b);
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 30px; /* Moves content higher */
        }

        /* Container with Shadows */
        .container {
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: inline-block;
            animation: fadeIn 1.2s ease-in-out;
        }

        h1 {
            color: #333;
        }

        /* Button Container - Tighter Spacing */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px; /* Reduced gap */
            position: relative;
            margin-top: 15px;
        }

        /* Compact Button Styling */
        .btn {
            padding: 8px 18px; /* More compact */
            font-size: 15px; 
            color: white;
            background: linear-gradient(135deg, #828d65, #6a7f4f);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            width: 140px; /* Uniform width */
            height: 40px; /* Set height for consistency */
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease-in-out;
            box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* Button Hover Effect */
        .btn:hover {
            background: linear-gradient(135deg, #6a7f4f, #828d65);
            transform: scale(1.05);
            box-shadow: 3px 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Dropdown Container */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        /* Dropdown Styling */
        .dropdown {
            display: none;
            position: absolute;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 2px solid #828d65;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 150px;
            text-align: left;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
        }

        .dropdown a {
            display: block;
            padding: 8px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s ease-in-out;
        }

        .dropdown a:hover {
            background: #f1f1f1;
        }

        /* LinkedIn Icon Styling */
        .linkedin-container {
            text-align: center;
            margin-top: 5px;
        }

        .linkedin-icon {
            width: 26px;
            height: 26px;
            transition: transform 0.3s ease-in-out;
        }

        .linkedin-icon:hover {
            transform: scale(1.15);
        }

        /* Fade-In Animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Weather App</h1>
        <p>Click the button below to check the weather.</p>
        
        <div class="button-container">
            <a href="resume.html" class="btn">Resume</a>
            
            <div class="dropdown-container">
                <button class="btn" id="dropdownBtn">Get Weather</button>
                <div class="dropdown" id="dropdownMenu">
                    <a href="weatherapp.html">Current Weather</a>
                    <a href="calculator.html">Go to Calculator</a> 
                    <a href="alerts.html">Weather Alerts</a>
                </div>

                <!-- LinkedIn Icon Below the "Get Weather" Button -->
                <div class="linkedin-container">
                    <a href="YOUR_LINKEDIN_URL" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="linkedin-icon">
                    </a>
                </div>
            </div>
            
            <a href="#" class="btn">In Development</a>
        </div>
    </div>

    <script>
        document.getElementById("dropdownBtn").addEventListener("click", function() {
            let dropdown = document.getElementById("dropdownMenu");
            if (dropdown.style.display === "block") {
                dropdown.style.opacity = "0";
                setTimeout(() => {
                    dropdown.style.display = "none";
                }, 200);
            } else {
                dropdown.style.display = "block";
                setTimeout(() => {
                    dropdown.style.opacity = "1";
                }, 10);
            }
        });

        document.addEventListener("click", function(event) {
            let dropdown = document.getElementById("dropdownMenu");
            let button = document.getElementById("dropdownBtn");

            if (!button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.opacity = "0";
                setTimeout(() => {
                    dropdown.style.display = "none";
                }, 200);
            }
        });
    </script>
</body>
</html>
