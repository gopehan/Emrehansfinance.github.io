<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        /* Background Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        /* Full-screen overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark translucent effect */
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease-in-out;
        }

        /* Text Styling */
        #overlay p {
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        /* Button styling */
        #overlay button {
            padding: 12px 24px;
            border: none;
            background: white;
            color: #1e3c72;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        #overlay button:hover {
            background: #ddd;
        }

        /* Header Styling */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: fixed;
            top: 0;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }

        .header .top-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .linkedin-icon {
            width: 28px;
            height: 28px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        .linkedin-icon:hover {
            transform: scale(1.2);
        }

        .container {
            margin: 100px auto 0; 
            display: flex;
            justify-content: center; 
            align-items: center;
            gap: 50px; 
            width: fit-content; 
            max-width: 90%;
            padding: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        
        }

        .container .about-text {
            text-align: left;
            max-width: 50%;
        }

        .container img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .projects {
            margin-top: 50px;
            padding: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(10px);
        }

        .project-box {
            display: inline-block;
            width: 200px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            margin: 15px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease-in-out;
            cursor: pointer;
        }

        .project-box:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Translucent Cover -->
    <div id="overlay">
        <p>Welcome to the Weather App</p>
        <button onclick="removeOverlay()">Enter</button>
    </div>

    <div class="header">
        <h1>Weather App</h1>
        <div class="top-right">
            <a href="resume.html" class="btn">Resume</a>
            <a href="YOUR_LINKEDIN_URL" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="linkedin-icon">
            </a>
            <button class="btn" onclick="sendEmail()">Contact Me</button>
        </div>
    </div>

    <div class="container">
        <div class="about-text">
            <h2>About Me</h2>
            <p>Write a brief introduction about yourself here.</p>
        </div>
        <img src="your-image.jpg" alt="Your Picture">
    </div>

    <div class="projects">
        <h2>Projects</h2>
        <a href="project1.html" class="project-box">Project 1</a>
        <a href="project2.html" class="project-box">Project 2</a>
        <a href="project3.html" class="project-box">Project 3</a>
    </div>

    <script>
        function sendEmail() {
            let recipient = "your.email@example.com"; 
            let subject = encodeURIComponent("Inquiry from Weather App");
            let body = encodeURIComponent("Hello,\n\nI would like to get in touch with you.\n\nBest regards.");
            
            let mailtoLink = `mailto:${recipient}?subject=${subject}&body=${body}`;
            window.location.href = mailtoLink;
        }

        function removeOverlay() {
            let overlay = document.getElementById("overlay");
            overlay.style.opacity = "0";
            setTimeout(() => {
                overlay.style.display = "none";
            }, 500); // Wait for fade-out transition
        }
    </script>

</body>
</html>
