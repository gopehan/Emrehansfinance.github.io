<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 100px;
            background-color: #20c1b9;
        }
        .container {
            padding: 50px;
            background-color: #d3809b;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }
        h1 {
            color: #333;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #828d65;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            width: 150px;
            text-align: center;
            display: inline-block;
            position: relative;
        }
        .btn:hover {
            background-color: #84658d;
        }
        
        .dropdown-container {
            position: relative;
            display: inline-block;
        }
        
        .dropdown {
            display: none;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: white;
            border: 2px solid #828d65;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 180px;
            text-align: left;
            z-index: 1000;
        }
        .dropdown a {
            display: block;
            padding: 10px;
            color: #333;
            text-decoration: none;
        }
        .dropdown a:hover {
            background-color: #f1f1f1;
        }
        
        .linkedin-container {
            text-align: center;
            margin-top: 10px;
        }
        .linkedin-icon {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Weather App</h1>
        <p>Click the button below to check the weather.</p>
        
        <div class="button-container">
            <a href="resume.html" class="btn">Resume</a>
            
            <div class="dropdown-container">
                <button class="btn" id="dropdownBtn">Get Weather</button>
                <div class="dropdown" id="dropdownMenu">
                    <a href="weatherapp.html">Current Weather</a>
                    <a href="calculator.html">Go to Calculator</a> <!-- Fixed link -->
                    <a href="alerts.html">Weather Alerts</a>
                </div>
                
                <!-- LinkedIn Icon Below the "Get Weather" Button -->
                <div class="linkedin-container">
                    <a href="YOUR_LINKEDIN_URL" target="_blank">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="linkedin-icon">
                    </a>
                </div>
            </div>
            
            <a href="#" class="btn">In Development</a>
        </div>
    </div>

    <script>
        document.getElementById("dropdownBtn").addEventListener("click", function() {
            let dropdown = document.getElementById("dropdownMenu");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
        });

        document.addEventListener("click", function(event) {
            let dropdown = document.getElementById("dropdownMenu");
            let button = document.getElementById("dropdownBtn");

            if (!button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });
    </script>
</body>
</html>
