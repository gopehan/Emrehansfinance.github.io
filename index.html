<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        /* Background Styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background: linear-gradient(135deg, #20c1b9, #d3809b);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Restoring Original Look */
        .container {
            padding: 50px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background: linear-gradient(135deg, #828d65, #6a7f4f);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            width: 150px;
            text-align: center;
            transition: 0.3s ease-in-out;
        }

        .btn:hover {
            background: linear-gradient(135deg, #6a7f4f, #828d65);
            transform: scale(1.05);
        }

        /* Dropdown Container */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        /* Dropdown Styling */
        .dropdown {
            display: none;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: 2px solid #828d65;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 160px;
            text-align: left;
            z-index: 1000;
        }

        .dropdown a {
            display: block;
            padding: 10px;
            color: #333;
            text-decoration: none;
        }

        .dropdown a:hover {
            background: #f1f1f1;
        }

        /* Footer Styling */
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #6a7f4f;
            color: white;
            padding: 10px 0;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Contact Me Button (Moved to Right) */
        .contact-btn {
            padding: 8px 15px;
            font-size: 14px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            margin-left: auto;
        }

        .contact-btn:hover {
            background: #e64a19;
        }

        /* LinkedIn Icon */
        .linkedin-icon {
            width: 28px;
            height: 28px;
            margin-left: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        .linkedin-icon:hover {
            transform: scale(1.2);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Weather App</h1>
        <p>Click the button below to check the weather.</p>

        <div class="button-container">
            <a href="resume.html" class="btn">Resume</a>

            <div class="dropdown-container">
                <button class="btn" id="dropdownBtn">Get Weather</button>
                <div class="dropdown" id="dropdownMenu">
                    <a href="weatherapp.html">Current Weather</a>
                    <a href="calculator.html">Go to Calculator</a> 
                    <a href="alerts.html">Weather Alerts</a>
                </div>
            </div>

            <a href="#" class="btn">In Development</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>Email: <a href="mailto:your.email@example.com">your.email@example.com</a></p>
        <a href="YOUR_LINKEDIN_URL" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn" class="linkedin-icon">
        </a>
        <button class="contact-btn" onclick="sendEmail()">Contact Me</button>
    </div>

    <script>
        document.getElementById("dropdownBtn").addEventListener("click", function(event) {
            let dropdown = document.getElementById("dropdownMenu");
            dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
            event.stopPropagation(); // Prevents closing dropdown immediately when clicking the button
        });

        document.addEventListener("click", function(event) {
            let dropdown = document.getElementById("dropdownMenu");
            let button = document.getElementById("dropdownBtn");

            if (!button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = "none";
            }
        });

        function sendEmail() {
            let recipient = "your.email@example.com"; // Replace with your email
            let subject = encodeURIComponent("Inquiry from Weather App");
            let body = encodeURIComponent("Hello,\n\nI would like to get in touch with you.\n\nBest regards.");
            
            let mailtoLink = `mailto:${recipient}?subject=${subject}&body=${body}`;
            window.location.href = mailtoLink;

            // Fallback alert if email client isn't available
            setTimeout(() => {
                if (window.location.href.indexOf("mailto:") !== -1) {
                    alert("If your email client did not open, please copy and paste this email: " + recipient);
                }
            }, 1000);
        }
    </script>

</body>
</html>
